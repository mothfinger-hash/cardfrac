<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>PathBinder — Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0e1a;
      --surface:#111726;
      --accent:#1AC7A0;
      --copper:#B87333;
      --text:#d8e0e8;
      --muted:#6a7888;
      --border:#1f2939;
    }
    body{
      font-family:'Space Mono',monospace;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }
    .container{max-width:440px}
    .logo{
      font-family:'Orbitron',monospace;
      font-size:1.6rem;
      font-weight:800;
      color:var(--accent);
      letter-spacing:.18em;
      margin-bottom:14px;
      text-shadow:0 0 18px rgba(26,199,160,.35);
    }
    .status{
      font-size:.72rem;
      color:var(--copper);
      letter-spacing:.18em;
      margin-bottom:32px;
      text-transform:uppercase;
    }
    h1{
      font-family:'Orbitron',monospace;
      font-size:1.2rem;
      color:var(--text);
      margin-bottom:14px;
      letter-spacing:.06em;
    }
    p{
      font-size:.85rem;
      color:var(--muted);
      line-height:1.65;
      margin-bottom:28px;
    }
    .btn{
      display:inline-block;
      padding:12px 28px;
      border:1px solid var(--accent);
      color:var(--accent);
      font-family:'Space Mono',monospace;
      font-size:.85rem;
      letter-spacing:.06em;
      cursor:pointer;
      background:transparent;
      transition:all .15s;
      text-decoration:none;
    }
    .btn:hover{background:var(--accent);color:var(--bg)}
    .blink{animation:blink 1s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .panel{
      border:1px solid var(--border);
      background:var(--surface);
      padding:32px 28px;
      border-left:3px solid var(--copper);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="logo">⬡ PATHBINDER</div>
      <div class="status">// CONNECTION_LOST <span class="blink">_</span></div>
      <h1>You're offline</h1>
      <p>No network connection. Your collection data is cached locally and safe — once you reconnect, listings, prices, and trades will sync automatically.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </div>
</body>
</html>
